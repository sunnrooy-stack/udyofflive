services:
  - type: web
    name: digital-product-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node index.js
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: RENDER_EXTERNAL_URL
        value: "https://udyofflive1111111111.onrender.com"
      - key: BACKEND_URL
        value: "https://udyofflive1111111111.onrender.com"
      - key: FRONTEND_URL
        value: "https://udyofflive.onrender.com"
      - key: ADMIN_URL
        value: "https://udyofflive8888.onrender.com"
